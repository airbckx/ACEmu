[package]
name = "acemu-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ACEmu admin service: REST API over the SQLite database plus the admin web app"

[dependencies]
acemu-db = { path = "../acemu-db" }
acemu-paths = { path = "../acemu-paths" }
anyhow.workspace = true
axum = "0.8"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
