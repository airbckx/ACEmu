[workspace]
resolver = "2"
members = [
    "crates/acemu-proto",
    "crates/acemu-paths",
    "crates/acemu-db",
    "crates/acemu-admin",
    "crates/acemu-login",
    "crates/acemu-channel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# the packet tables are large and rebuilt often
opt-level = 0
